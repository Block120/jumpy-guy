<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jumpy Guy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module">
    import kaplay from 'kaplay';

    const k = kaplay({
      width: 1280,
      height: 720,
      letterbox: true,
      background: '#14141e',
    });

    const player = k.add([
      k.rect(48, 48),
      k.pos(k.center()),
      k.anchor('center'),
      k.color(100, 220, 180),
      k.area(),
    ]);

    k.add([
      k.text('Jumpy Guy - Arrow/WASD, Controller, or Touch', { size: 24 }),
      k.pos(24, 24),
      k.color(220, 220, 220),
    ]);

    const SPEED = 400;

    // Keyboard controls
    k.onKeyDown('left', () => player.move(-SPEED, 0));
    k.onKeyDown('a', () => player.move(-SPEED, 0));
    k.onKeyDown('right', () => player.move(SPEED, 0));
    k.onKeyDown('d', () => player.move(SPEED, 0));
    k.onKeyDown('up', () => player.move(0, -SPEED));
    k.onKeyDown('w', () => player.move(0, -SPEED));
    k.onKeyDown('down', () => player.move(0, SPEED));
    k.onKeyDown('s', () => player.move(0, SPEED));

    // Gamepad / Switch Pro Controller / Joy-Con controls
    k.onGamepadButtonDown('dpad-left', () => player.move(-SPEED, 0));
    k.onGamepadButtonDown('dpad-right', () => player.move(SPEED, 0));
    k.onGamepadButtonDown('dpad-up', () => player.move(0, -SPEED));
    k.onGamepadButtonDown('dpad-down', () => player.move(0, SPEED));
    k.onGamepadStick('left', (stick) => {
      if (Math.abs(stick.x) > 0.15 || Math.abs(stick.y) > 0.15) {
        player.move(stick.x * SPEED, stick.y * SPEED);
      }
    });

    // Touch / Mouse controls
    k.onMouseDown(() => {
      const dir = k.mousePos().sub(player.pos).unit();
      player.move(dir.scale(SPEED));
    });
  </script>
</body>
</html>
